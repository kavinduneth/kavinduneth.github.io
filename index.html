  // ========== Default content (About + Timeline) ==========
  const defaultContent = document.getElementById('content-area').innerHTML;

  // ========== Mobile popup window ==========
  const folderTitles = {
    web: 'About',
    mobile: 'Projects',
    game: 'Articles & Contents',
    certs: 'Certificates & CV'
  };

  const mobileQuery = window.matchMedia('(max-width: 768px)');
  const modalOverlay = document.getElementById('modal-overlay');
  const modalBody = document.getElementById('modal-body');
  const modalTitle = document.getElementById('modal-title');
  const modalClose = document.getElementById('modal-close');

  function openModal(category) {
    modalTitle.textContent = folderTitles[category] || '';
    modalBody.innerHTML = folderContent[category];
    modalBody.innerHTML = folderContent[category];
    setupReadMore(modalBody);          // ← add this line
    modalBody.scrollTop = 0;
    modalOverlay.classList.add('open');
    modalOverlay.setAttribute('aria-hidden', 'false');
    document.body.classList.add('modal-open');
  }

  function closeModal() {
    modalOverlay.classList.remove('open');
    modalOverlay.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('modal-open');
    // clear after the closing animation so videos stop playing
    setTimeout(() => {
      if (!modalOverlay.classList.contains('open')) modalBody.innerHTML = '';
    }, 350);
  }

  modalClose.addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) closeModal();      // tap outside window
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });
  // If the screen grows to desktop size while open, close the popup
  mobileQuery.addEventListener('change', (e) => {
    if (!e.matches) closeModal();
  });

  // ========== "Read more" for long project descriptions ==========
function setupReadMore(container) {
  container.querySelectorAll('.project-desc').forEach(desc => {
    // only add the link if the text is actually cut off
    if (desc.scrollHeight > desc.clientHeight + 1) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'read-more';
      btn.textContent = 'Read more';
      btn.addEventListener('click', () => {
        const open = desc.classList.toggle('expanded');
        btn.textContent = open ? 'Show less' : 'Read more';
      });
      desc.insertAdjacentElement('afterend', btn);
    }
  });
}

  // ========== Click handler ==========
  document.querySelectorAll('.folder-card').forEach(card => {
    card.addEventListener('click', () => {
      const category = card.dataset.category;
      const contentArea = document.getElementById('content-area');

      if (!folderContent[category]) return;

      if (mobileQuery.matches) {
        openModal(category);                            // mobile: popup window
      } else {
        
        contentArea.innerHTML = folderContent[category]; // desktop: unchanged
        setupReadMore(contentArea);                       // ← add this line
      }
    });
  });
